name: Validar Estudio PHP
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Validar banco, conservación, selección y persistencia
        run: npm run check
      - name: Compilar en producción
        run: npm run build
